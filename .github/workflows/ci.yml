name: Shell checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bats and PTY utilities
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats util-linux
      - name: Check Bash syntax
        run: |
          bash -n npass-tui
          bash -n tests/test-npass-tui.bats
      - name: Run Bats tests
        run: bats tests/test-npass-tui.bats
