name: Shell checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          bash -n npass-tui
          bash -n tests/test-npass-tui.sh
      - name: Run mock CLI PTY smoke tests
        run: bash tests/test-npass-tui.sh
