name: Shell checks

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  bash-syntax:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Bats
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats
      - name: Check Bash syntax
        run: |
          bash -n npass-tui
          bash -n tests/test_helper.bash
          python3 -m py_compile tests/pty_driver.py
      - name: Validate Bats test files
        run: bats --count tests/*.bats
      - name: Run Bats tests
        run: timeout 90s bats tests/*.bats
